services:
  database:
    image: postgres:16-alpine
    container_name: nestor-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - portfolio_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - portfolio_network

  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestor-portfolio
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - portfolio_storage:/var/www/html/storage/app/public
    networks:
      - portfolio_network

volumes:
  portfolio_db:
  portfolio_storage:

networks:
  portfolio_network:
    driver: bridge
